<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选题雷达 · 本地工作台</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#162b24;background:#f6f5ef;font-synthesis:none;--hair:#cbd1c4;--green:#24583f;--muted:#59685f}*{box-sizing:border-box}body{margin:0}header{height:64px;border-bottom:1px solid var(--hair);padding:0 5vw;display:flex;align-items:center;justify-content:space-between}.identity{display:flex;align-items:center;gap:11px;font-weight:750}.logo{height:28px;width:28px;border:3px solid #264f38;border-radius:50%;background:radial-gradient(circle,#24583f 0 16%,transparent 17% 40%,#83a986 41% 52%,transparent 53%)}header span,.source,.time,small{color:var(--muted);font-size:14px}.wrap{max-width:1480px;padding:42px 5vw 45px;margin:auto}h1{font-size:clamp(38px,4.2vw,62px);line-height:1.1;letter-spacing:-.05em;margin:0 0 12px}p{line-height:1.55;margin:0}h2{font-size:22px;letter-spacing:-.04em;margin:0 0 14px}h3{margin:4px 0 10px;font-size:clamp(24px,2.4vw,38px);letter-spacing:-.045em;line-height:1.12;overflow-wrap:anywhere}.intro{font-size:17px;color:var(--muted)}.metrics{margin:27px 0;display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--hair)}.metric{padding:13px 22px;border-left:1px solid var(--hair);display:flex;align-items:baseline;gap:13px}.metric:first-child{border-left:0;padding-left:0}.metric b{font:600 38px/1.15 "Helvetica Neue",Arial,sans-serif;letter-spacing:-.05em}.metric span{font-size:16px;font-weight:650}.columns{display:grid;grid-template-columns:minmax(275px, .83fr) minmax(0,1.62fr);gap:42px}.controls{padding-right:30px;border-right:1px solid var(--hair)}button{border:1px solid #9fae9c;background:transparent;padding:10px 14px;border-radius:5px;color:#183627;font:650 15px/1.3 inherit;font-family:inherit;font-size:15px;font-weight:650;cursor:pointer}button:hover{background:#e1e7d9}button.primary{border-color:var(--green);background:var(--green);color:white}button.primary:hover{background:#183d2b}button:disabled{opacity:.45;cursor:wait}.pick{padding:13px 0 18px;border-bottom:1px solid var(--hair)}.pick strong{display:block;font-size:17px;margin:1px 0 5px}.pick p{font-size:14px;color:var(--muted);margin-bottom:12px}.result{min-height:27px;padding:9px 0 0;color:var(--green);font-weight:700;font-size:14px}.tabs{display:flex;gap:8px}.tabs button{border:0;border-radius:20px;padding:5px 12px;color:var(--muted)}.tabs button[aria-pressed=true]{background:#dfebde;color:#20462f}.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.bar h2{margin:0}.item,.empty{border:1px solid var(--hair);padding:22px 25px;background:#fffef9;border-radius:8px;margin-bottom:10px}.item{border-top:3px solid #356747}.source{font-weight:700;color:var(--green)}.brief{font-size:16px;margin-bottom:15px;color:#34473d}.links{display:flex;align-items:center;gap:20px}.links a{color:#294e3b;font-weight:650;font-size:14px}.empty{color:var(--muted);min-height:172px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.65}.history{margin-top:22px}.history ul{list-style:none;padding:0;margin:0}.history li{display:grid;grid-template-columns:70px 1fr auto;gap:16px;padding:8px 0;border-top:1px solid var(--hair);font-size:15px}.time{font-family:ui-monospace,monospace}.foot{margin-top:24px;font-size:13px;color:var(--muted)}@media(max-width:720px){header{padding:0 5vw}.wrap{padding-top:24px}.columns{display:flex;flex-direction:column;gap:22px}.controls{padding:0;border:0}.metric{padding:11px 8px;gap:3px;display:grid}.metric b{font-size:30px}.metric span{font-size:13px}.item{padding:16px}.bar{flex-wrap:wrap;gap:7px}}
</style></head><body>
<header><div class="identity"><i aria-hidden="true" class="logo"></i>选题雷达</div><span>本地工作台 · SQLite</span></header>
<main class="wrap"><h1>公开更新，变成待审选题。</h1><p class="intro">关注智能体与工作流。相同来源自动去重，由你决定哪条值得跟进。</p>
<section class="metrics" aria-label="工作台统计"><div class="metric"><b id="total">0</b><span>独立来源条目</span></div><div class="metric"><b id="pending">0</b><span>待审核</span></div><div class="metric"><b id="approved">0</b><span>已收录</span></div></section>
<div class="columns"><section class="controls"><h2>收取更新</h2>
<div class="pick"><strong>Anthropic 原文样本</strong><p>回放《Building always-on agents》的公开标题和链接，可重复投入测试去重。</p><button id="sample" class="primary">投入样本事件</button></div>
<div class="pick"><strong>LangGraph 官方发行记录</strong><p>联网读取 GitHub Atom 的最近十条版本更新。</p><button id="live">读取真实更新</button></div>
<p id="result" class="result" role="status"></p></section>
<section><div class="bar"><h2>选题清单</h2><div class="tabs"><button id="p-tab" aria-pressed="true">待审核</button><button id="a-tab" aria-pressed="false">已收录</button></div></div>
<div id="items"></div><div class="history"><h2>最近操作</h2><ul id="history"></ul></div></section></div>
<p class="foot">本机规则生成采访提纲。确认后存入本地清单，供后续查证和编辑。</p></main>
<script>
const $=id=>document.getElementById(id);
const make=(tag,text,klass)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(klass)n.className=klass;return n};
let tab="pending",busy=false;
async function refresh(){
 const res=await fetch("/state",{cache:"no-store"}); if(!res.ok)throw Error("读取本地状态失败");
 const s=await res.json(), list=s.items.filter(x=>x.state===tab);
 $("total").textContent=s.items.length;
 for(const k of ["pending","approved"])$(k).textContent=s.items.filter(x=>x.state===k).length;
 $("items").replaceChildren(); $("history").replaceChildren();
 $("p-tab").setAttribute("aria-pressed",tab==="pending");
 $("a-tab").setAttribute("aria-pressed",tab==="approved");
 if(!list.length)$("items").append(make("div",tab==="pending"?"当前没有待审选题。投入一个样本或读取真实更新。":"还没有收录。请在待审核列表中确认选题。","empty"));
 for(const x of list){
  const d=make("article",null,"item");d.append(make("span",x.source+"  ·  #"+x.id,"source"),make("h3",x.title),make("p",x.draft,"brief"));
  const links=make("div",null,"links"),link=make("a","查看原文 ↗");link.href=x.url;link.rel="noreferrer";link.target="_blank";
  if(x.state==="pending"){const b=make("button","确认收录","primary");b.onclick=()=>action("/approve/"+x.id,true);links.append(b)}
  links.append(link);d.append(links);$("items").append(d);
 }
 if(!s.history.length)$("history").append(make("li","尚无记录"));
 for(const h of s.history.slice(0,5)){
  const li=make("li");li.append(make("span",new Date(h.stamp).toLocaleTimeString("en-GB",{hour12:false}),"time"),make("strong",h.action),make("span","#"+h.item_id,"time"));$("history").append(li);
 }
}
async function action(url,approved=false){
 if(busy)return;busy=true;$("result").textContent="正在处理…";
 const buttons=[...document.querySelectorAll("button")];buttons.forEach(b=>b.disabled=true);
 try{const r=await fetch(url,{method:"POST",headers:{"X-Radar-Action":"local"}}), data=await r.json();
 if(!r.ok)throw Error(data.error||"操作失败");
 $("result").textContent=data.action+(data.id?" · #"+data.id:"");if(approved)tab="approved";else tab="pending";await refresh()}
 catch(e){$("result").textContent=e.message}
 finally{buttons.forEach(b=>b.disabled=false);busy=false}
}
$("sample").onclick=()=>action("/sample");$("live").onclick=()=>action("/live");
$("p-tab").onclick=()=>{tab="pending";refresh()};$("a-tab").onclick=()=>{tab="approved";refresh()};
refresh().catch(e=>$("result").textContent=e.message);
</script></body></html>
